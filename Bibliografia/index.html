<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrategias de Marketing, Precios y Gestión - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #054C50; 
            --accent-bright: #4ce6ef; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(5, 76, 80, 0.4);
            --text-main: #ffffff;
            --text-dim: #d0f0f2;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #021a1b;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #011112; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #083335 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(5, 76, 80, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
        }
        .card:hover { border-color: var(--accent-bright); transform: translateY(-5px); background: rgba(5, 76, 80, 0.12); box-shadow: 0 10px 20px rgba(5, 76, 80, 0.25); }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(5, 76, 80, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        💰 <b>Instrucción de Navegación:</b> Consulta las referencias clave sobre estrategias de marketing, fijación de precios, microeconomía y gestión de la cadena de suministro.
    </div>

    <header class="main-header">
        <h1>Bibliografía</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Barría, F. J. (2024)", t: "El Producto y sus atributos como factores fundamentales de las estrategias de marketing", f: "Ciencia Latina Revista Científica Multidisciplinar" },
            { a: "Best, R. (2000)", t: "Market-based management: Strategies for growing customer value and profitability", f: "Prentice Hall" },
            { a: "Bulow, J., & Klemperer, P. (2022)", t: "Prices and the winner's curse", f: "Journal of Economics" },
            { a: "Hinterhuber, A., & Liozu, S. (2016)", t: "Pricing and the sales force", f: "Taylor & Francis" },
            { a: "Kotler, P. (2006)", t: "Dirección de mercadotecnia", f: "UNSA", u: "https://fad.unsa.edu.pe/bancayseguros/wp-content/uploads/sites/4/2019/03/DIRECCION-DE-MERCADOTECNIA-PHILIP-KOTLER.pdf" },
            { a: "Kotler, P., Keller, K. L., & Chernev, A. (2022)", t: "Marketing Management", f: "Global Edition", u: "https://sinhvien.dinhtienminh.net/wp-content/uploads/2019/01/Marketing-Management-Global-Edition-Philip-Kotler-Kevin-Lane-Keller-16th-2021_compressed-1.pdf" },
            { a: "Lozada, M. (2017)", t: "Estrategia de precio", f: "Fundación Universitaria del Área Andina" },
            { a: "Morales, M. N., Calderón, M. E., & Mejía, G. R. (2017)", t: "Marketing operativo de precios y canales de distribución", f: "Revista Contribuciones a la Economía" },
            { a: "Moya Espinosa, P. I. (2015)", t: "Introducción a la Mercadotecnia", f: "Editorial UPTC" },
            { a: "Nagle, T., Muller, G., & Gruyaert, E. (2023)", t: "Estrategia y tácticas de fijación de precios: una guía para aumentar la rentabilidad", f: "Taylor & Francis" },
            { a: "Pindyck, R., & Rubinfeld, D. (2018)", t: "Microeconomics", f: "Pearson" },
            { a: "Silva, J. D. (2017)", t: "Gestión de la cadena de suministro: una revisión desde la logística y el medioambiente", f: "Entre Ciencia e Ingeniería" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
