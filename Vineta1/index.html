<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Estrategia de Precios Interactivo</title>
    <!-- Tailwind CSS CDN para utilidad de estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Montserrat desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8fafc;
            color: #1a1a1a;
        }

        /* 
           Forma de Flecha Chevron
        */
        .chevron-arrow {
            clip-path: polygon(
                0% 0%, 
                calc(100% - 22px) 0%, 
                100% 50%, 
                calc(100% - 22px) 100%, 
                0% 100%, 
                22px 50%
            );
            background-color: #007a87;
            transition: background-color 0.3s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chevron-arrow:hover {
            background-color: #005f69;
            transform: translateY(-4px) scale(1.02);
        }

        .chevron-arrow:active {
            transform: translateY(-1px) scale(0.99);
            background-color: #004d55;
        }

        /* Sombra suave personalizada simulada en el contenedor */
        .chevron-shadow {
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.08));
            transition: filter 0.3s ease;
        }

        .step-container:hover .chevron-shadow {
            filter: drop-shadow(0px 10px 15px rgba(0, 122, 135, 0.25));
        }

        /* Estilos para animación de entrada escalonada (Staggered Entry) */
        .animate-step {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .animate-step.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Botón animado */
        .control-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .control-btn:hover {
            transform: translateY(-2px);
        }
        .control-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 bg-slate-50 selection:bg-teal-100 selection:text-teal-800">

    <!-- Barra Superior de Controles -->
    <header class="w-full max-w-5xl mx-auto flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 rounded-full bg-[#007a87] animate-pulse"></span>
            <span class="text-xs uppercase tracking-widest text-slate-500 font-bold">Diagrama Interactivo</span>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Botón Mute / Unmute -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="control-btn flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 text-xs sm:text-sm font-semibold shadow-sm hover:border-teal-600 hover:text-[#007a87] focus:outline-none focus:ring-2 focus:ring-[#007a87] focus:ring-opacity-50">
                <svg id="soundIcon" class="w-4 h-4 text-[#007a87]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
                </svg>
                <span id="soundStatusText">Sonido: Activado</span>
            </button>

            <!-- Botón Reiniciar Animación -->
            <button onclick="triggerEntranceAnimation()" class="control-btn flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#007a87] text-white text-xs sm:text-sm font-semibold shadow-sm hover:bg-[#00606b] focus:outline-none focus:ring-2 focus:ring-[#007a87] focus:ring-opacity-50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>Reproducir Entrada</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto my-auto py-8 px-4">
        
        <!-- Contenedor Principal Grid de 3 Columnas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-3 items-start">

            <!-- BLOQUE 1: Costos -->
            <div id="step-1" class="step-container animate-step flex flex-col space-y-4 group">
                <!-- Flecha 1 -->
                <div class="chevron-shadow w-full">
                    <div 
                        class="chevron-arrow h-20 sm:h-22 w-full flex items-center justify-center cursor-pointer shadow-sm select-none"
                        onmouseenter="playHoverSound(300)"
                        onclick="playClickSound(400)"
                    >
                        <span class="text-white text-3xl font-extrabold tracking-tight">1</span>
                    </div>
                </div>
                <!-- Texto explicativo 1 -->
                <div class="px-2 sm:px-4 text-left transition-all duration-300 group-hover:translate-x-1">
                    <h3 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight mb-1">
                        Costos
                    </h3>
                    <p class="text-sm sm:text-base text-slate-600 font-medium leading-snug">
                        límite económico de referencia
                    </p>
                </div>
            </div>

            <!-- BLOQUE 2: Competencia -->
            <div id="step-2" class="step-container animate-step flex flex-col space-y-4 group">
                <!-- Flecha 2 -->
                <div class="chevron-shadow w-full">
                    <div 
                        class="chevron-arrow h-20 sm:h-22 w-full flex items-center justify-center cursor-pointer shadow-sm select-none"
                        onmouseenter="playHoverSound(400)"
                        onclick="playClickSound(520)"
                    >
                        <span class="text-white text-3xl font-extrabold tracking-tight">2</span>
                    </div>
                </div>
                <!-- Texto explicativo 2 -->
                <div class="px-2 sm:px-4 text-left transition-all duration-300 group-hover:translate-x-1">
                    <h3 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight mb-1">
                        Competencia
                    </h3>
                    <p class="text-sm sm:text-base text-slate-600 font-medium leading-snug">
                        referencia del mercado
                    </p>
                </div>
            </div>

            <!-- BLOQUE 3: Valor percibido -->
            <div id="step-3" class="step-container animate-step flex flex-col space-y-4 group">
                <!-- Flecha 3 -->
                <div class="chevron-shadow w-full">
                    <div 
                        class="chevron-arrow h-20 sm:h-22 w-full flex items-center justify-center cursor-pointer shadow-sm select-none"
                        onmouseenter="playHoverSound(500)"
                        onclick="playClickSound(650)"
                    >
                        <span class="text-white text-3xl font-extrabold tracking-tight">3</span>
                    </div>
                </div>
                <!-- Texto explicativo 3 -->
                <div class="px-2 sm:px-4 text-left transition-all duration-300 group-hover:translate-x-1">
                    <h3 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight mb-1">
                        Valor percibido
                    </h3>
                    <p class="text-sm sm:text-base text-slate-600 font-medium leading-snug">
                        disposición a pagar del cliente
                    </p>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer informativo -->
    <footer class="w-full max-w-5xl mx-auto text-center text-xs text-slate-400 py-4">
        Haz clic sobre los botones para ampliar la información.
    </footer>

    <!-- Lógica de Sintetizador de Sonido (Web Audio API) y Animaciones -->
    <script>
        // ESTADO GLOBAL DE AUDIO
        let audioCtx = null;
        let isMuted = false;

        // Inicializar Web Audio API bajo demanda (debido a las políticas de Autoplay de los navegadores)
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Alternar Silenciar/Activar Sonido
        function toggleSound() {
            isMuted = !isMuted;
            const soundStatusText = document.getElementById('soundStatusText');
            const soundIcon = document.getElementById('soundIcon');

            if (isMuted) {
                soundStatusText.textContent = "Sonido: Silenciado";
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-dasharray="2 2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
            } else {
                soundStatusText.textContent = "Sonido: Activado";
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>`;
                playHoverSound(440); // Feedback sonoro al activar
            }
        }

        // Efecto Sonoro sutil para Hover (Glint tone)
        function playHoverSound(freq = 350) {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                // Rampa suave de volumen
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch (e) {
                console.warn('Web Audio no soportado o bloqueado');
            }
        }

        // Efecto Sonoro para Click (Chirp / Pop armónico)
        function playClickSound(startFreq = 400) {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(startFreq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(startFreq * 1.5, ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch (e) {
                console.warn('Web Audio no soportado o bloqueado');
            }
        }

        // Reproducir arpegio de entrada con los pasos
        function playEntranceArpeggio() {
            if (isMuted) return;
            const notes = [261.63, 329.63, 392.00]; // Acorde Do Mayor (C4, E4, G4)
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    playHoverSound(freq * 1.2);
                }, idx * 180 + 100);
            });
        }

        // LÓGICA DE ANIMACIÓN DE ENTRADA ESCALONADA (Staggered Entrance)
        function triggerEntranceAnimation() {
            const steps = [
                document.getElementById('step-1'),
                document.getElementById('step-2'),
                document.getElementById('step-3')
            ];

            // 1. Resetear estados
            steps.forEach(step => {
                if (step) step.classList.remove('visible');
            });

            // 2. Animación secuencial
            steps.forEach((step, index) => {
                setTimeout(() => {
                    if (step) step.classList.add('visible');
                }, index * 180 + 100);
            });

            // 3. Acompañamiento sonoro
            playEntranceArpeggio();
        }

        // Iniciar animación automáticamente al cargar la página
        window.onload = function() {
            // Un breve retardo para asegurar renderizado fluido
            setTimeout(() => {
                triggerEntranceAnimation();
            }, 100);
        };
    </script>
</body>
</html>
